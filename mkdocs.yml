site_name: Ziman AI
site_description: Kurdish Sorani and Kurmanji translator for Chrome, with an offline phrasebook and optional AIML translation.
site_author: Naser Sadrmanesh
site_url: https://sadrmanesh.github.io/ziman-ai/
repo_url: https://github.com/sadrmanesh/ziman-ai
repo_name: sadrmanesh/ziman-ai
edit_uri: ""
copyright: Copyright &copy; 2025&ndash;2026 Naser Sadrmanesh

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sadrmanesh
    - icon: material/web
      link: https://sadrmanesh.github.io/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/sadrmanesh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Shortcuts and context menu: shortcuts.md
  - Offline phrasebook: phrasebook.md
  - AI translation: ai-translation.md
  - Privacy: privacy.md
  - Changelog: changelog.md
  - فارسی: fa.md
  - کوردی: ku.md
